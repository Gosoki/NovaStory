[server]
# 生产默认:不热重载、不监视文件(fileWatcherType 才是决定「改文件踢会话」的那一行)。开发用 `make dev`。
runOnSave = false
fileWatcherType = "none"
# 断线会话保留 10 分钟(默认 120 秒):切 App / 锁屏 / 隧道这类分钟级抖动能接回同一会话,
# 不必走 ?t= 续接。再长会把长时间离开也算进时长 DV。整页重载仍是新会话 → state._attempt_resume。
disconnectedSessionTTL = 600

[browser]
gatherUsageStats = false

[client]
# Hide Streamlit's own English chrome (the "Deploy" button + ☰ hamburger menu)
# so a Japanese participant never sees stray English. Researcher tools live in
# the sidebar, not this toolbar, so nothing is lost. ("minimal" keeps only items
# the app itself adds — here, none.)
toolbarMode = "minimal"

# 亮 / 暗切换圆钮(app.py _masthead)用 Streamlit 的宿主消息当场换主题,它只收这里列出的来源发的消息。
# 列的是我们自己的网址(正式站 + 本机预览);替换掉默认的 Streamlit Community Cloud 域名(本项目用不到)。
# 只有同一页面里的脚本能以本来源发这种消息 —— 没有被嵌进别人网页时,外站发不进来。
allowedOrigins = ["https://test.jp.wuzuxi.com", "http://127.0.0.1:8510", "http://127.0.0.1:8531", "http://localhost:8510"]

# 出错时不要把 Python 栈打给被试。默认是 "full" —— 而 views/ 与 core/(除 db.py 外)没有
# 任何一处捕获 sqlite3.OperationalError,磁盘满、库权限变化、写锁超时这类意外会直接把
# 整段 traceback(含文件路径)糊在被试屏幕上,既吓人又泄露部署细节。"none" 只显示一句
# 通用错误,细节仍照常写进服务端日志,研究员那边不受影响。
showErrorDetails = "none"

# ── 主题(v2设计,2026-10-31):和纸 / 墨 / 青 ────────────────────────────────
# 底色是暖白的「和纸」、正文与「决定」按钮是「墨」、强调色与 AI 动作是「青」(不带紫的海蓝,色相约 210°;
# 初版用过偏靛紫的瑠璃色 #1e50a2 / 深色 #8fabf5,用户嫌发紫,2026-10-31 换掉)。
# 颜色的单一真源仍是 app.py 的 --ns-* 令牌;这里只把同一组值交给 Streamlit 自己的组件
# (输入框、勾选框、单选点、进度条、提示框、表格),两边改色要一起改。
# 跟随被试**操作系统**的明暗:只有 [theme.light] 与 [theme.dark] 同时存在时 Streamlit 才自动切换;
# 只写 [theme] 会锁死浅色。[theme] 这里只放与明暗无关的项(圆角、字阶、边框开关)。
# 对比度(WCAG):正文 14.5 / 弱化字 4.8(浅)· 6.9(深)/ 强调色 5.3(浅)· 8.3(深)/ 按钮字 ≥5.0 —— 均过 AA。
[theme]
baseRadius = "0.625rem"
buttonRadius = "0.625rem"
showWidgetBorder = true
# 原默认 h1–h3 是 2.75 / 2.25 / 1.75rem:一个 st.subheader 就占掉手机三行屏幕。
headingFontSizes = ["1.75rem", "1.375rem", "1.125rem", "1rem", "0.9375rem", "0.875rem"]
headingFontWeights = [700, 700, 600, 600, 600, 600]

[theme.light]
primaryColor = "#1565c0"
backgroundColor = "#f6f5f1"
secondaryBackgroundColor = "#ffffff"
textColor = "#1f2328"
borderColor = "#d9d5cb"
linkColor = "#1565c0"
codeBackgroundColor = "#f1efe9"
dataframeHeaderBackgroundColor = "#f1efe9"
blueColor = "#1565c0"
greenColor = "#2b6e47"
yellowColor = "#b7791f"
orangeColor = "#c2410c"
redColor = "#b42318"
grayColor = "#8a8f98"
# 提示框(st.info / success / warning / error)= 整块色块 + 同色系深色字(v1 的形态,用户 2026-10-31 定:
# 「还是之前那种整个都是色块的好用」),颜色换成和本套配色协调的值。字 / 底对比度 6.8–8.5。
blueBackgroundColor = "#e3eefb"
blueTextColor = "#0d4a8f"
greenBackgroundColor = "#e2efe6"
greenTextColor = "#1f5a39"
yellowBackgroundColor = "#f8ecd2"
yellowTextColor = "#6f4800"
redBackgroundColor = "#f9e3e1"
redTextColor = "#962015"

[theme.dark]
primaryColor = "#64b5f6"
backgroundColor = "#131417"
secondaryBackgroundColor = "#1b1d22"
textColor = "#e7e5df"
borderColor = "#30333b"
linkColor = "#64b5f6"
codeBackgroundColor = "#22252b"
dataframeHeaderBackgroundColor = "#22252b"
blueColor = "#64b5f6"
greenColor = "#7cc99a"
yellowColor = "#e5b65a"
orangeColor = "#f0a060"
redColor = "#f28b82"
grayColor = "#5b5f68"
blueBackgroundColor = "#1e2b36"
blueTextColor = "#b3dcff"
greenBackgroundColor = "#24312c"
greenTextColor = "#b5e3c6"
yellowBackgroundColor = "#352e22"
yellowTextColor = "#f3d593"
redBackgroundColor = "#372728"
redTextColor = "#f8bdb7"
